[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to function calling in LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.3",
    "mypy>=1.8.0",
]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = "llm_sdk/"

[[tool.mypy.overrides]]
module = [
    "llm_sdk",
    "llm_sdk.*"
]
ignore_errors = true

[tool.flake8]
exclude = [
    ".venv",
    "llm_sdk",
    "__pycache__",
    "data"
]